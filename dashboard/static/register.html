<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar acesso · Escon Agentes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8fb; --panel: #fff; --text: #0f172a; --muted: #475569;
      --border: #dde3ec; --accent: #1d4ed8; --danger: #b91c1c; --radius: 14px;
      --shadow: 0 20px 44px rgba(15,23,42,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--panel);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.75rem 1.6rem 1.5rem;
    }
    .brand { display: flex; align-items: center; gap: .75rem; margin-bottom: 1rem; }
    .logo {
      width: 42px; height: 42px; border-radius: 12px; background: var(--accent);
      color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .95rem;
    }
    h1 { margin: 0; font-size: 1.15rem; }
    p.sub { margin: .15rem 0 0; color: var(--muted); font-size: .88rem; line-height: 1.4; }
    label { display: block; font-size: .82rem; font-weight: 600; margin: .75rem 0 .3rem; color: var(--muted); }
    input {
      width: 100%; padding: .65rem .75rem; border: 1px solid var(--border);
      border-radius: 10px; font: inherit; font-size: .95rem;
    }
    input:focus { outline: 2px solid rgba(29,78,216,.35); border-color: var(--accent); }
    .btn {
      width: 100%; margin-top: 1.1rem; padding: .7rem 1rem; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600;
      font-size: .95rem; cursor: pointer;
    }
    .btn:disabled { opacity: .6; cursor: wait; }
    .err { color: var(--danger); font-size: .85rem; margin-top: .75rem; min-height: 1.2em; }
    .foot { margin-top: 1.1rem; font-size: .85rem; color: var(--muted); text-align: center; }
    .foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .hint {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px;
      padding: .65rem .8rem; font-size: .82rem; color: #1e3a8a; margin-bottom: .5rem; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">EA</div>
      <div>
        <h1>Criar acesso</h1>
        <p class="sub">Use o código de convite que o Anderson passou</p>
      </div>
    </div>
    <div class="hint">
      Sem convite não dá para cadastrar — peça ao Anderson (admin) um código
      <strong>ESCON-…</strong> no painel, aba Equipe / Acessos.
    </div>
    <form id="form">
      <label for="invite">Código de convite</label>
      <input id="invite" required placeholder="ESCON-ABC123" autocomplete="off" />
      <label for="name">Seu nome</label>
      <input id="name" required placeholder="Seu nome" autocomplete="name" />
      <label for="email">E-mail</label>
      <input id="email" type="email" required placeholder="voce@email.com" autocomplete="username" />
      <label for="password">Senha (mín. 8 caracteres)</label>
      <input id="password" type="password" required minlength="8" autocomplete="new-password" />
      <button class="btn" type="submit" id="btn">Criar conta e entrar</button>
      <p class="err" id="err"></p>
    </form>
    <p class="foot">Já tem conta? <a href="/login">Entrar</a></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("code")) document.getElementById("invite").value = params.get("code");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const btn = document.getElementById("btn");
      err.textContent = "";
      btn.disabled = true;
      try {
        const r = await fetch("/api/auth/register", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            invite_code: document.getElementById("invite").value.trim(),
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const t = await r.text();
        let d = {};
        try { d = JSON.parse(t); } catch (_) { d = { detail: t }; }
        if (!r.ok) {
          const msg = Array.isArray(d.detail)
            ? d.detail.map((x) => x.msg || JSON.stringify(x)).join("; ")
            : (d.detail || r.statusText);
          throw new Error(msg);
        }
        location.href = "/";
      } catch (ex) {
        err.textContent = ex.message || "Erro ao criar conta";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
