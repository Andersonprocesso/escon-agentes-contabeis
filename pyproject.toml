[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escon-agentes"
version = "0.1.0"
description = "Sistema multiagente contábil — Escon Soluções Contábeis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "lxml>=5.0.0",
  "tenacity>=8.3.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
escon-agentes = "escon_agentes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
