# Painel dos agentes na VPS da Hostinger (147.79.86.221 / srv653140).
#
# Sai do Vercel e vem para cá porque no Vercel só havia conversa: os agentes
# são Python e precisam ler XML, PDF, OneDrive e o Radar. Aqui rodam de
# verdade, e o escritório (home office) abre pelo navegador de qualquer lugar.
#
# Assume o lugar do sistema antigo em lancamentos.escondigital.com.br. O
# Traefik desta VPS já resolve HTTPS por Let's Encrypt, então basta a label
# com o mesmo Host — o certificado já existe e a URL não muda.
#
# CUIDADO: esta VPS também roda o EsconZap (WhatsApp da Secretaria), o
# atendemei e o financeiro. Mexer só no que é nosso.
services:
  painel:
    build: .
    image: escon-agentes-painel
    container_name: escon-agentes
    restart: unless-stopped
    env_file: .env
    environment:
      ESCON_DATA_DIR: /app/data
      # chave do Radar (VPS 76.x) montada abaixo — se faltar, OneDrive ainda funciona
      ESCON_RADAR_SSH_KEY: /app/secrets/radar_escon_vps
    volumes:
      # cadastro de clientes, títulos em aberto e planilhas geradas não podem
      # morrer com o container
      - agentes_data:/app/data
      # cache do login da Microsoft: sem isso cada restart pede device code
      - agentes_msal:/app/.msal_cache
      # SSH para o Radar (MinIO/Postgres). Arquivo no host: /opt/escon-agentes/secrets/
      - ./secrets/radar_escon_vps:/app/secrets/radar_escon_vps:ro
    networks: [lancamentos_net]
    labels:
      - traefik.enable=true
      - traefik.docker.network=lancamentos_net
      - "traefik.http.routers.agentes.rule=Host(`lancamentos.escondigital.com.br`)"
      - traefik.http.routers.agentes.entrypoints=websecure
      - traefik.http.routers.agentes.tls.certresolver=letsencrypt
      - traefik.http.services.agentes.loadbalancer.server.port=8787
      # Login próprio no app (cookie + usuários em data/users.json).
      # Basic auth do Traefik desligado — evitaria o login novo (dupla senha).

volumes:
  agentes_data:
  agentes_msal:

networks:
  lancamentos_net:
    name: lancamentos_net
    external: true
