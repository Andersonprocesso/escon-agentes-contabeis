    credito: "@banco"
    historico: 0
    visto_no_razao: 8

  - id: honorario_contabil
    quando: {contem: ["HONORARIO", "CONTABILIDADE"]}
    debito: 3111303          # Servicos de terceiros
    credito: "@banco"
    historico: 0
    visto_no_razao: 6

  - id: juros_bancarios
    quando: {contem: ["JUROS", "TARIFA", "IOF", "COMISSAO"]}
    debito: 3231107
    credito: "@banco"
    historico: 0
    visto_no_razao: 10

  - id: depreciacao
    quando: {contem: ["DEPRECIACAO", "DEPRECIAÇÃO"]}
    debito: 3221410
    credito: 1232201         # (-) Depr. Acum. moveis e utensilios
    historico: 18
    visto_no_razao: 44
    descricao: "Conferir se o bem é móvel (1232201) ou máquina (1232204)"
