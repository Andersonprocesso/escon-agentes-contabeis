    credito: "@banco"
    historico: 11
    visto_no_razao: 14

  - id: agua
    quando: {contem: ["SABESP", "AGUA", "ESGOTO"]}
    debito: 3221402
    credito: "@banco"
    historico: 10
    visto_no_razao: 12

  - id: aluguel_veiculo
    quando: {contem: ["LOCACAO", "ALUGUEL", "PRESTACAO DO CARRO", "LEASING"]}
